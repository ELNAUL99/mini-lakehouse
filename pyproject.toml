[project]
name = "mini-lakehouse"
version = "0.1.0"
description = "A small, production-shaped lakehouse: Kafka -> Iceberg on object storage, queried with an OLAP engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Naul" }]

# Runtime dependencies. The pure domain core (src/mini_lakehouse/domain, /ports)
# intentionally depends on nothing here -- it is tested without containers.
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Adapters that talk to real infrastructure. Not needed to run the domain tests.
adapters = [
  "confluent-kafka>=2.4",
  "pyiceberg[s3fs,duckdb]>=0.7",
  "pyarrow>=16.0",
  "psycopg[binary]>=3.1",
  "boto3>=1.34",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
ml-gateway = "mini_lakehouse.gateway.__main__:main"
ml-ingestor = "mini_lakehouse.ingestor.__main__:main"
ml-maintenance = "mini_lakehouse.maintenance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_lakehouse"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["mini_lakehouse"]
mypy_path = "src"

# Strict typing is enforced only on the domain and ports -- the tested core.
# Adapters and service glue are checked more loosely (they wrap untyped libs).
[[tool.mypy.overrides]]
module = ["mini_lakehouse.domain.*", "mini_lakehouse.ports.*"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mini_lakehouse.adapters.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: pure domain tests, no containers",
  "integration: requires Testcontainers (Redpanda, MinIO, REST catalog)",
  "chaos: slow failure-injection tests",
]

[tool.coverage.run]
source = ["mini_lakehouse.domain", "mini_lakehouse.ports"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
