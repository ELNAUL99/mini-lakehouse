name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: lint + types + unit/chaos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict on domain + ports)
        run: mypy
      - name: Unit + chaos tests with coverage
        run: pytest -m "unit or chaos" --cov=mini_lakehouse.domain --cov=mini_lakehouse.ports
      - name: Validate contracts
        run: python -m mini_lakehouse.tools.validate_contracts contracts/

  integration:
    name: integration (Testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (with adapters)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,adapters,api]"
      - name: Integration tests
        run: pytest -m integration
      - name: Docker build smoke test
        run: docker build -f deploy/compose/Dockerfile -t mini-lakehouse:ci .

  chaos-nightly:
    name: chaos (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -m chaos -q
