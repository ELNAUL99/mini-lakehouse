# Local stack (design doc section 9). Two profiles keep laptops happy (risk: OOM):
#   core   - redpanda, minio, postgres, iceberg-rest, gateway, ingestor, maintenance, platform-api
#   extras - trino, prometheus, grafana, redpanda-console
#
# Usage:
#   docker compose --profile core up -d
#   docker compose --profile core --profile extras up -d
#
# Secrets here are LOCAL DEFAULTS only; production injects them via env/k8s secrets.
name: mini-lakehouse

x-python-env: &python-env
  ML_KAFKA_BOOTSTRAP: redpanda:9092
  ML_S3_ENDPOINT: http://minio:9000
  ML_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  ML_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  ML_S3_BUCKET: lakehouse
  ML_CATALOG_URI: http://iceberg-rest:8181
  ML_CATALOG_WAREHOUSE: s3://lakehouse/warehouse

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    profiles: [core]
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    profiles: [extras]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on: [redpanda]

  minio:
    # NOTE: MinIO's public images on Docker Hub and quay.io now require auth
    # ("pull access denied"). To run the stack either `docker login` with an
    # account that can pull minio/minio + minio/mc, or swap both for an
    # accessible S3-compatible image. The Iceberg write path itself is verified
    # without object storage: `pytest -m integration` (local filesystem catalog).
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    profiles: [core]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/lakehouse &&
      echo 'bucket ready'"

  postgres:
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceberg}
      POSTGRES_DB: catalog
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d catalog"]
      interval: 10s
      timeout: 5s
      retries: 10

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest  # TODO: pin to a digest (the 1.6.0 tag does not exist)
    profiles: [core]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      CATALOG_URI: jdbc:postgresql://postgres:5432/catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-iceberg}
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
    ports: ["8181:8181"]

  gateway:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile}
    profiles: [core]
    command: ["python", "-m", "mini_lakehouse.gateway"]
    environment:
      <<: *python-env
      ML_EVENTS_PER_SEC: "5000"
    depends_on:
      redpanda: {condition: service_healthy}
    ports: ["8001:8001"]

  ingestor:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile}
    profiles: [core]
    command: ["python", "-m", "mini_lakehouse.ingestor"]
    environment: {<<: *python-env, ML_TABLE: bronze.events}
    depends_on:
      redpanda: {condition: service_healthy}
      iceberg-rest: {condition: service_started}

  maintenance:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile}
    profiles: [core]
    command: ["python", "-m", "mini_lakehouse.maintenance", "--interval-s", "900"]
    environment: *python-env
    depends_on:
      iceberg-rest: {condition: service_started}

  platform-api:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile}
    profiles: [core]
    command: ["uvicorn", "mini_lakehouse.platform_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *python-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  trino:
    image: trinodb/trino:453
    profiles: [extras]
    ports: ["8082:8080"]
    depends_on: [iceberg-rest]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [extras]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [extras]
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  minio-data:
  pg-data:
